name: Preview CSS probe (issue #6)
# Runs when Vercel reports a successful Preview deployment. Reads the deployed CSS and checks computed
# styles in Chromium, WebKit and Firefox on the real Preview. Vercel protection stays enabled: access uses
# the automation bypass secret only; without it the job reports BLOCKED and changes nothing.

on:
  deployment_status:

permissions:
  contents: read

jobs:
  probe:
    if: github.event.deployment_status.state == 'success' && contains(github.event.deployment_status.environment_url, 'vercel.app') && !contains(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 20
    env:
      PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Require the bypass secret (protection is never disabled)
        id: gate
        shell: bash
        run: |
          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET}" ]]; then
            echo "::warning::BLOCKED: VERCEL_AUTOMATION_BYPASS_SECRET is not configured; the protected Preview cannot be read. Protection remains enabled."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Inspect the CSS the Preview actually serves
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          H=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" -H "x-vercel-set-bypass-cookie: true")
          for route in /koleksiyon /deneyim; do
            html=$(curl -fsS "${H[@]}" "${PREVIEW_URL}${route}")
            echo "== ${route}"
            for href in $(printf '%s' "$html" | grep -o 'href="/_next/static/[^"]*\.css"' | cut -d'"' -f2 | sort -u); do
              css=$(curl -fsS "${H[@]}" "${PREVIEW_URL}${href}")
              printf '%s bytes=%s series-grid=%s explorer-layout=%s tail-globals=%s tail-foundation=%s\n' "$href" "${#css}" \
                "$(grep -c -o 'collection-series-grid' <<<"$css" || true)" "$(grep -c -o 'experience-explorer-layout' <<<"$css" || true)" \
                "$(grep -c -o 'css-tail-globals' <<<"$css" || true)" "$(grep -c -o 'css-tail-foundation' <<<"$css" || true)"
            done
          done
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Computed styles on the real Preview (Chromium, WebKit, Firefox)
        if: steps.gate.outputs.ready == 'true'
        run: pnpm exec playwright test -c playwright.preview.config.ts
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.ready == 'true'
        with:
          name: preview-css-probe-report
          path: playwright-report-preview/
          retention-days: 7
