name: Refresh migration lockfile

on:
  push:
    branches: [chore/vercel-portability-phase1]
    paths:
      - ".github/workflows/refresh-migration-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/chore/vercel-portability-phase1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Resolve lockfile without running package scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Verify frozen lockfile
        run: pnpm install --lockfile-only --ignore-scripts --frozen-lockfile
      - name: Commit lockfile only on migration branch
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- pnpm-lock.yaml
            git commit -m "build: sync Neon dependency lockfile"
            git push origin HEAD:chore/vercel-portability-phase1
          fi
