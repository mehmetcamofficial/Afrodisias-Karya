name: Preview HTTP security smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_URL: https://altin-dal-aphrodisias-iqd77djyg-dragonfire-09s-projects.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Check protected Preview without changing protection
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET}" ]]; then
            echo "::error::BLOCKED: configure VERCEL_AUTOMATION_BYPASS_SECRET as an Actions secret; protection remains enabled."
            exit 1
          fi
          test_http() {
            local label="$1" expected="$2" method="$3" path="$4" payload="${5:-}"
            local code
            if [[ "$method" == POST ]]; then
              code=$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code}' \
                -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
                -H "Content-Type: application/json" \
                -X POST --data "$payload" "${PREVIEW_URL}${path}")
            else
              code=$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code}' \
                -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
                "${PREVIEW_URL}${path}")
            fi
            echo "$label: HTTP $code (expected $expected)"
            case "$expected" in
              200) [[ "$code" == 200 ]] ;;
              4xx) [[ "$code" == 400 || "$code" == 422 ]] ;;
              auth) [[ "$code" == 401 || "$code" == 403 ]] ;;
            esac || { echo "::error::$label unexpected HTTP $code"; return 1; }
          }
          test_http "Homepage" 200 GET /
          test_http "Products" 200 GET /api/products
          test_http "Invalid order" 4xx POST /api/orders '{}'
          test_http "Unauthorized orders" auth GET /api/orders
