name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  cms-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_admin
          POSTGRES_PASSWORD: test_only_local
          POSTGRES_DB: altindal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_admin -d altindal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Disposable service container only; the suite refuses non-local URLs.
      - run: pnpm test:db
        env:
          DATABASE_URL_TEST: postgres://test_admin:test_only_local@127.0.0.1:5432/altindal_test

  e2e:
    runs-on: ubuntu-latest
    # Match @playwright/test 1.63.0; browser and Linux dependencies are preinstalled.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 30
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
